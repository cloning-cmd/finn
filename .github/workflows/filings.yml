name: filings
# Pull NSE filings for the portfolio, classify, score, enrich results. Every 30 min during IST market+evening hours.
on:
  schedule:
    - cron: "*/30 3-14 * * 1-5"   # 08:30–20:00 IST, Mon–Fri
  workflow_dispatch:
    inputs:
      days:
        description: "backfill window in days (blank = incremental)"
        required: false
        default: ""

concurrency:
  group: filings
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CHEAP_MODEL: ${{ vars.CHEAP_MODEL }}
      CHEAP_MODEL_FALLBACK: ${{ vars.CHEAP_MODEL_FALLBACK }}
      STRONG_MODEL: ${{ vars.STRONG_MODEL }}
      STRONG_MODEL_FALLBACK: ${{ vars.STRONG_MODEL_FALLBACK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - name: Seed portfolio (idempotent)
        run: python -m jobs.seed
      - name: Ingest + classify + score + enrich
        run: |
          if [ -n "${{ github.event.inputs.days }}" ]; then python -m jobs.run_filings "${{ github.event.inputs.days }}"; else python -m jobs.run_filings; fi
