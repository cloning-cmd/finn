name: eod
# End-of-day prices (yfinance), market-adjusted anomalies, explain-the-move links. After NSE close, Mon–Fri.
on:
  schedule:
    - cron: "45 12 * * 1-5"   # 18:15 IST
  workflow_dispatch:
    inputs:
      period:
        description: "yfinance history period (default 400d)"
        required: false
        default: "400d"

concurrency:
  group: eod
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - name: Seed portfolio (idempotent)
        run: python -m jobs.seed
      - name: Prices + anomalies + explain
        run: python -m jobs.run_eod "${{ github.event.inputs.period || '400d' }}"
